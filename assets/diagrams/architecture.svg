<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="XRECONY architecture">
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#06172a"/><stop offset="1" stop-color="#0b2b4c"/></linearGradient></defs>
<rect width="1200" height="520" rx="24" fill="url(#bg)"/><text x="60" y="58" fill="#44d7ff" font-family="Segoe UI" font-size="17" font-weight="700" letter-spacing="3">PUBLIC ARCHITECTURE</text>
<g font-family="Segoe UI">
<rect x="60" y="100" width="280" height="310" rx="24" fill="#0c2745" stroke="#275a82"/><text x="90" y="145" fill="#fff" font-size="23" font-weight="700">Readable Sources</text><text x="90" y="188" fill="#abc7dc" font-size="16">• Local folders</text><text x="90" y="220" fill="#abc7dc" font-size="16">• Mounted HDD / SSD</text><text x="90" y="252" fill="#abc7dc" font-size="16">• Mounted SMB / NAS</text><text x="90" y="284" fill="#abc7dc" font-size="16">• Portable metadata manifest</text><text x="90" y="340" fill="#6ee7c2" font-size="15" font-weight="700">SOURCE READ-ONLY</text>
<rect x="460" y="100" width="280" height="310" rx="24" fill="#0b355e" stroke="#35b9ff"/><text x="490" y="145" fill="#fff" font-size="23" font-weight="700">Reconstruction Core</text><text x="490" y="188" fill="#b9d5e9" font-size="16">• Passport + capture</text><text x="490" y="220" fill="#b9d5e9" font-size="16">• Structural relationships</text><text x="490" y="252" fill="#b9d5e9" font-size="16">• Generations + comparison</text><text x="490" y="284" fill="#b9d5e9" font-size="16">• Duplicate/version candidates</text><text x="490" y="316" fill="#b9d5e9" font-size="16">• Evidence + drift</text><text x="490" y="360" fill="#44d7ff" font-size="15" font-weight="700">SEPARATE WORKSPACE</text>
<rect x="860" y="100" width="280" height="310" rx="24" fill="#172d40" stroke="#ff7b22"/><text x="890" y="145" fill="#fff" font-size="23" font-weight="700">Outputs</text><text x="890" y="188" fill="#d4dfe9" font-size="16">• Source / Type / Timeline</text><text x="890" y="220" fill="#d4dfe9" font-size="16">• Recovery view</text><text x="890" y="252" fill="#d4dfe9" font-size="16">• Reports / exports</text><text x="890" y="284" fill="#d4dfe9" font-size="16">• Verification receipts</text><text x="890" y="316" fill="#d4dfe9" font-size="16">• Copy-first realization</text><text x="890" y="360" fill="#ffb16f" font-size="15" font-weight="700">NO SOURCE OVERWRITE</text>
</g>
<path d="M340 255 H460" stroke="#37c4ff" stroke-width="4"/><path d="M740 255 H860" stroke="#ff7b22" stroke-width="4"/>
<text x="60" y="470" fill="#86abc7" font-family="Segoe UI" font-size="15">XRECONY focuses on understanding readable data estates. It is not deleted-file recovery, disk repair or a backup system.</text>
</svg>